name: Build Cal.diy images

# Cal.diy publishes no ready-made image, and building it needs ~8 GB of memory, far more than the
# production server has. This builds both images on GitHub's machines and stores them in GHCR.
# Run it by hand: GitHub > Actions > "Build Cal.diy images" > Run workflow. It takes ~30-60 min.
# See calcom/README.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "cal.diy commit, tag or branch to build (pin a commit for repeatable builds)"
        default: ef7954d16ab50882ca2f263c551537115b8a8bb1
        required: true
      api_v2_url:
        description: "Public API address baked into the web image, e.g. https://cal.example.com/api/v2 (optional)"
        default: ""
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: Dockerfile
          - name: api
            dockerfile: apps/api/v2/Dockerfile
    steps:
      - name: Make room (disk and memory)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/build.swap && sudo chmod 600 /mnt/build.swap
          sudo mkswap /mnt/build.swap && sudo swapon /mnt/build.swap
          free -h && df -h /

      - name: Check out cal.diy
        uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ inputs.ref }}

      - name: Names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/calcom-diy-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.short }}
            ${{ steps.names.outputs.image }}:latest
          build-args: |
            CALCOM_TELEMETRY_DISABLED=1
            NEXT_PUBLIC_API_V2_URL=${{ inputs.api_v2_url }}
            MAX_OLD_SPACE_SIZE=6144
            DATABASE_URL=postgresql://build:build@localhost:5432/calendso
            DATABASE_DIRECT_URL=postgresql://build:build@localhost:5432/calendso
          cache-from: type=gha,scope=calcom-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=calcom-${{ matrix.name }}
