[project]
name = "ai-calling-agent"
version = "0.1.0"
description = "Self-hosted AI voice calling agent for US phone calls."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic-settings==2.16.2",
    "httpx==0.28.1",
    "websockets==17.4",
    "orjson==3.13.0",
    "structlog==26.1.0",
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "redis==5.3.1",
    "arq==0.28.0",
    "pipecat-ai[silero,openai,websocket]==1.15.0",
    "twilio==9.13.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["arq.*", "pipecat.*", "twilio.*"]
ignore_missing_imports = true
