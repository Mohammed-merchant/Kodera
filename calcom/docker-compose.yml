# Cal.diy (self-hosted scheduling) next to the Kodera stack.
# Run through ./deploy.sh, not directly. It joins the Kodera network (kodera_default) so it
# can use the same Postgres and Redis servers (its own database and Redis db number).
#
# Memory: web ~1 GB and api ~0.5 GB at rest. See README.md "Server size".

name: calcom

x-common: &common
  restart: unless-stopped
  networks: [kodera]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  calcom-web:
    <<: *common
    image: ${CAL_WEB_IMAGE:?Set CAL_WEB_IMAGE in calcom/.env}
    mem_limit: ${CAL_WEB_MEMORY:-1536m}
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres:5432
      DATABASE_URL: postgresql://calcom:${CAL_DB_PASSWORD}@postgres:5432/calcom?connection_limit=4
      DATABASE_DIRECT_URL: postgresql://calcom:${CAL_DB_PASSWORD}@postgres:5432/calcom
      NEXT_PUBLIC_WEBAPP_URL: ${CAL_PUBLIC_URL}
      NEXT_PUBLIC_WEBSITE_URL: ${CAL_PUBLIC_URL}
      NEXTAUTH_URL: ${CAL_PUBLIC_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
      CALCOM_TELEMETRY_DISABLED: "1"
      # The built-in booking page calls API v2 through the public URL.
      NEXT_PUBLIC_API_V2_URL: ${CAL_PUBLIC_URL}/api/v2
      EMAIL_FROM: ${EMAIL_FROM:-notifications@example.com}
      EMAIL_SERVER_HOST: ${EMAIL_SERVER_HOST:-}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_SERVER_USER: ${EMAIL_SERVER_USER:-}
      EMAIL_SERVER_PASSWORD: ${EMAIL_SERVER_PASSWORD:-}
      NODE_OPTIONS: --max-old-space-size=1024
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s   # first start runs the database migrations

  calcom-api:
    <<: *common
    image: ${CAL_API_IMAGE:?Set CAL_API_IMAGE in calcom/.env}
    mem_limit: ${CAL_API_MEMORY:-768m}
    depends_on:
      calcom-web:
        condition: service_healthy   # the web container creates/migrates the database first
    environment:
      NODE_ENV: production
      API_PORT: "80"
      API_URL: ${CAL_PUBLIC_URL}
      WEB_APP_URL: ${CAL_PUBLIC_URL}
      DATABASE_URL: postgresql://calcom:${CAL_DB_PASSWORD}@postgres:5432/calcom?connection_limit=4
      DATABASE_READ_URL: postgresql://calcom:${CAL_DB_PASSWORD}@postgres:5432/calcom?connection_limit=4
      DATABASE_WRITE_URL: postgresql://calcom:${CAL_DB_PASSWORD}@postgres:5432/calcom?connection_limit=4
      DATABASE_DIRECT_URL: postgresql://calcom:${CAL_DB_PASSWORD}@postgres:5432/calcom
      REDIS_URL: redis://redis:6379/1   # db 1: Kodera uses db 0
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
      API_KEY_PREFIX: cal_
      REWRITE_API_V2_PREFIX: "true"
      LOG_LEVEL: warn
      NODE_OPTIONS: --max-old-space-size=512
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/v2/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

networks:
  kodera:
    name: kodera_default
    external: true
